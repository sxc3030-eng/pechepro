default_install_hook_types: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: mixed-line-ending
        args: ['--fix=lf']
        # Windows-only scripts MUST stay CRLF per .gitattributes — excluding
        # them here prevents an infinite loop where the hook flips them to LF
        # and git checkout flips them back on the next Windows checkout.
        exclude: '\.(ps1|psm1|psd1|bat|cmd|iss)$'

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        additional_dependencies: ['types-requests', 'httpx==0.28.1', 'flask==3.0.3']
        exclude: ^(tests/|deploy/|data/|scripts/)
